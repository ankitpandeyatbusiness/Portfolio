<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="aqua-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <!-- Bright Cyan/Aqua at the top left -->
      <stop offset="0%" stop-color="#22D3EE" /> 
      <!-- Deep Teal/Ocean Blue at the bottom right -->
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
  </defs>
  
  <!-- The slightly rounded background square -->
  <rect width="512" height="512" rx="112" fill="url(#aqua-gradient)" />
  
  <!-- The 'AP' Initials -->
  <text 
    x="50%" 
    y="54%" 
    font-family="'Space Grotesk', 'DM Sans', system-ui, sans-serif" 
    font-size="260" 
    font-weight="800" 
    fill="#FFFFFF" 
    text-anchor="middle" 
    dominant-baseline="middle"
    letter-spacing="-8"
  >
    AP
  </text>
</svg>
